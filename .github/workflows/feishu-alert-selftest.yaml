name: Feishu Alert Selftest

# 一次性自检：故意让脚本失败，确认飞书告警能从 GitHub Runner 正常发出。
# 验证完可以删除本文件。

on:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip > /dev/null
          pip install -r requirements.txt

      - name: Force a failure to trigger the alert
        continue-on-error: true
        env:
          # 故意用无效 token，不碰真实 secret
          TOKEN: invalid-token-selftest
          TOKEN_SOURCE: h5
          DEBUG: '1'
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: python auto_checkin.py
